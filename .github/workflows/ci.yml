name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compile & install dependencies (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Tkinter system package
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile the application
        run: python -m py_compile fourier_epicycle_studio.py

      - name: Import the application module (headless)
        run: |
          python - <<'PY'
          import fourier_epicycle_studio as app

          for name in ("UnifiedFourierStudioApp", "DrawingPadPanel", "FourierAnalyzerPanel", "main"):
              assert hasattr(app, name), f"missing expected symbol: {name}"

          print("import OK")
          PY
